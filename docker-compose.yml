services:
  postgres:
    # Keep in sync with POSTGRES_IMAGE in tests/integration/postgres.py.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: needtoknow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d needtoknow"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
